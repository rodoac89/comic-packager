name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      
      - name: Install SkiaSharp dependencies
        run: 
          sudo apt-get update
          sudo apt-get install -y libskia libfontconfig1

      - name: Test
        run: dotnet test --configuration Release --nologo
